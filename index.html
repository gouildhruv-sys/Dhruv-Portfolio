<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dhruv’s Portfolio – Video Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0818;--ink:#f6f1ff;--mut:#aaa2c8;--pink:#ff4d8d;--cyan:#3de0ff;--lime:#c8ff5a;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0818;--ink:#f6f1ff}}
:root[data-theme="dark"]{--bg:#0b0818;--ink:#f6f1ff}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:radial-gradient(900px 520px at 88% -5%,rgba(255,77,141,.24),transparent 60%),radial-gradient(800px 520px at 0% 45%,rgba(61,224,255,.15),transparent 60%),var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;line-height:1.6;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,footer{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 20px}
h1,h2{font-family:'Syne','Space Grotesk',sans-serif;font-weight:800;margin:0;line-height:1.02}
.offer{position:relative;z-index:2;text-align:center;background:linear-gradient(90deg,var(--pink),#ff8a3d,var(--pink));background-size:200% 100%;animation:slide 6s linear infinite;color:#1a0a1f;font-weight:700;padding:9px 14px;font-size:.95rem}
@keyframes slide{to{background-position:200% 0}}
nav{display:flex;justify-content:space-between;align-items:center;padding:22px 0}
nav b{font-family:'Syne',sans-serif;font-size:1.4rem}
nav a{color:var(--ink);text-decoration:none;margin-left:22px;font-weight:500}
nav a:hover{color:var(--cyan)}
.hero{padding:24px 0 10px;display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center}
h1{font-size:clamp(2.5rem,9vw,5.2rem);letter-spacing:-.025em;background:linear-gradient(100deg,var(--ink) 25%,var(--cyan) 60%,var(--pink));background-size:170% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shift 7s ease-in-out infinite alternate}
@keyframes shift{to{background-position:100% 0}}
.sub{color:var(--mut);font-size:1.1rem;max-width:50ch;margin:16px 0 24px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;color:#140a24;background:linear-gradient(100deg,var(--pink),#ff8fb5);border:0;border-radius:99px;padding:12px 24px;cursor:pointer;text-decoration:none;display:inline-block;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(255,77,141,.4)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 18px;font-size:.9rem}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.photo{position:relative;justify-self:center;width:min(320px,72vw);aspect-ratio:4/5;border-radius:30px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,77,141,.3),rgba(61,224,255,.2));display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 8px rgba(255,255,255,.04),0 25px 70px rgba(255,77,141,.3);transition:transform .15s ease-out;color:var(--mut);font-size:.9rem}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
h2{font-size:clamp(1.9rem,5.5vw,3rem);margin:70px 0 8px}
.lead{color:var(--mut);margin:0 0 22px}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;perspective:1100px}
.slot{position:relative;aspect-ratio:16/10;border-radius:20px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,77,141,.2),rgba(61,224,255,.12));overflow:hidden;transition:transform .18s ease-out,box-shadow .3s;display:grid;place-items:center;box-shadow:0 20px 50px rgba(0,0,0,.35);color:var(--mut)}
.slot:hover{box-shadow:0 24px 60px rgba(61,224,255,.2)}
.slot video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.play{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 8px;animation:pulse 2.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(61,224,255,0)}0%{box-shadow:0 0 0 0 rgba(61,224,255,.5)}}
.play svg{width:26px;height:26px;fill:var(--cyan)}
.tag{position:absolute;left:12px;top:12px;z-index:2;background:rgba(0,0,0,.6);padding:4px 12px;border-radius:99px;font-size:.82rem;color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:20px}
.tog{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:4px;background:var(--card)}
.tog button{font:inherit;font-weight:700;color:var(--ink);background:transparent;border:0;border-radius:99px;padding:9px 22px;cursor:pointer}
.tog button[aria-pressed="true"]{background:linear-gradient(100deg,var(--pink),var(--cyan));color:#140a24}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;perspective:1100px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;backdrop-filter:blur(10px);transition:transform .15s ease-out,border-color .2s}
.card:hover{border-color:var(--cyan)}
.card h3{margin:0;font-size:1.2rem}
.len{color:var(--mut);font-size:.92rem;margin:2px 0 16px}
.price{font-family:'Syne',sans-serif;font-size:clamp(1.9rem,5vw,2.5rem);font-weight:800;line-height:1.1;background:linear-gradient(100deg,var(--ink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.was{display:block;font-family:'Space Grotesk',sans-serif;font-size:.95rem;font-weight:400;color:var(--mut);-webkit-text-fill-color:var(--mut);text-decoration:line-through;margin-top:4px}
.off{position:absolute;top:16px;right:16px;background:var(--lime);color:#1a2300;font-weight:700;font-size:.78rem;padding:3px 10px;border-radius:99px}
.card.big{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px;border-color:var(--pink);background:linear-gradient(120deg,rgba(255,77,141,.2),rgba(61,224,255,.12))}
.card.big p{margin:6px 0 0;max-width:52ch}
.note{color:var(--mut);font-size:.85rem;margin-top:14px;min-height:1.4em}
.soc{display:flex;gap:18px;justify-content:center;margin:20px 0 14px}
.soc a{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);transition:transform .25s,background .25s}
.soc a:hover{transform:translateY(-8px) rotate(-6deg) scale(1.08);background:linear-gradient(135deg,var(--pink),var(--cyan))}
.soc svg{width:30px;height:30px;fill:var(--ink)}
.contact{text-align:center}
footer{text-align:center;color:var(--mut);padding:30px 20px 40px;font-size:.9rem}
#adm{position:fixed;inset:0;z-index:50;background:rgba(5,3,14,.88);backdrop-filter:blur(8px);overflow:auto;padding:max(20px,env(safe-area-inset-top,0px)) 16px 40px}
.panel{max-width:640px;margin:0 auto;background:#15102b;border:1px solid var(--line);border-radius:22px;padding:24px}
.panel h3{font-family:'Syne',sans-serif;font-size:1.5rem;margin:0 0 4px}
.panel h4{margin:22px 0 8px;color:var(--cyan)}
.row{display:flex;gap:10px;align-items:center;margin:6px 0;flex-wrap:wrap}
.row label{flex:1 1 150px;color:var(--mut);font-size:.92rem}
.panel input[type=number],.panel input[type=text]{font:inherit;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:110px}
.panel input[type=text]{width:100%;flex:1 1 220px}
.panel .st{color:var(--lime);font-size:.85rem}.blk{border:1px solid var(--line);border-radius:14px;padding:8px 12px 12px;margin:10px 0}
@media(max-width:760px){.hero{grid-template-columns:1fr;text-align:center}.cta{justify-content:center}.photo{order:-1}.slots{grid-template-columns:1fr}.slot{aspect-ratio:16/9}nav a{margin-left:14px}}
@media(prefers-reduced-motion:reduce){h1,.play,.offer{animation:none}*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="app"></div>
<script type="application/json" id="data">{"photo":"","videos":[{"l":"Featured Edit","u":""},{"l":"Reel Edit","u":""},{"l":"Ad Edit","u":""}],"offer":{"on":true,"pct":10},"cards":[{"t":"Long Video Edit","l":"10–15 minutes","a":500,"b":1000},{"t":"Short Edit","l":"1–5 minutes","a":100,"b":200},{"t":"Reel Edit","l":"0–90 seconds","a":100,"b":200},{"t":"Advertisement","l":"Brand and product ads","a":1000,"b":2000}],"tx":{"title":"Dhruv’s Portfolio","sub":"I’m Dhruv, a video editor. I turn raw footage into smooth, sharp edits that keep people watching.","ctitle":"Customised Live Edit","ctext":"Great value for money. I edit live based on your video, exactly the way you ask."},"discord":"https://discord.com","insta":"https://instagram.com","rate":85}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Standalone mode: runs when the page is NOT inside Claude. Change the password below. */
if(typeof claude==='undefined'){
const ADMIN_PASSWORD='dhruv123';
window.claude={use:async n=>{
 if(n==='user'){let ok=localStorage.getItem('adm_ok')==='1';
  if(!ok&&(location.hash==='#admin'||/\/admin\/?$/.test(location.pathname))&&prompt('Admin password')===ADMIN_PASSWORD){ok=true;localStorage.setItem('adm_ok','1');}
  return {canEdit:()=>ok};}
 if(n==='assets')return {upload:f=>new Promise((res,rej)=>{if(f.size>8e6)return rej(new Error('Too big to upload. Paste a YouTube, Drive or .mp4 link instead'));const r=new FileReader();r.onload=()=>res({url:r.result});r.onerror=()=>rej(new Error('Read failed'));r.readAsDataURL(f);})};
 if(n==='artifact')return {publish:async h=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='index.html';document.body.appendChild(a);a.click();a.remove();alert('Done! Upload this new index.html to your hosting to update the live site.');}};
 return null;}};
}
</script>
<script>
const S=JSON.parse(document.getElementById('data').textContent);
const app=document.getElementById('app');
let cur='INR',claudeUser=null,isAdmin=false;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const safeUrl=u=>/^(https?:\/\/|\/|videos\/|images\/|data:(image|video)\/)/.test(u)?u:'';
const ICON_D='<svg viewBox="0 0 24 24"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.2.5a18.3 18.3 0 0 0-6.4 0L8.6 3a19.8 19.8 0 0 0-4.9 1.4C.6 9 0 13.5.3 18a19.9 19.9 0 0 0 6 3l1.3-2.1c-.7-.3-1.4-.6-2-1l.5-.4a14.2 14.2 0 0 0 11.8 0l.5.4c-.6.4-1.3.7-2 1l1.3 2.1a19.9 19.9 0 0 0 6-3c.4-5.2-.7-9.7-3.4-13.6ZM8.5 15.3c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.1 1.1 2.1 2.4-.9 2.4-2.1 2.4Zm7 0c-1.2 0-2.1-1.1-2.1-2.4s.9-2.4 2.1-2.4 2.1 1.1 2.1 2.4-.9 2.4-2.1 2.4Z"/></svg>';
const ICON_I='<svg viewBox="0 0 24 24"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7Zm5 3.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Zm5.2-3.2a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2Z"/></svg>';

function fmt(v){if(cur==='INR')return '₹'+Math.round(v).toLocaleString('en-IN');const x=v/S.rate;return '$'+(x<10?(+x.toFixed(1)):Math.round(x));}
const disc=v=>S.offer.on?v*(100-S.offer.pct)/100:v;
function vid(u){const f='<iframe allowfullscreen loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;border:0" src="';
let m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/);if(m)return f+'https://www.youtube.com/embed/'+m[1]+'"></iframe>';
m=u.match(/vimeo\.com\/(\d+)/);if(m)return f+'https://player.vimeo.com/video/'+m[1]+'"></iframe>';
m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/);if(m)return f+'https://drive.google.com/file/d/'+m[1]+'/preview"></iframe>';
return '<video src="'+esc(u)+'" controls playsinline preload="metadata"></video>';}
function render(){
  const pl='<div class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>';
  const tx=S.tx;
  app.innerHTML=(S.offer.on?'<div class="offer">NEW CLIENTS GET '+S.offer.pct+'% OFF on every edit</div>':'')+
  '<main><nav><b>Dhruv</b><div><a href="#work">Work</a><a href="#pricing">Pricing</a><a href="#contact">Contact</a></div></nav>'+
  '<section class="hero"><div><h1>'+esc(tx.title)+'</h1><p class="sub">'+esc(tx.sub)+'</p><div class="cta"><a class="btn" href="#pricing">See pricing</a><a class="btn ghost" href="#contact">Get in touch</a></div></div>'+
  '<div class="photo tilt">'+(safeUrl(S.photo)?'<img alt="Dhruv" src="'+esc(S.photo)+'">':'<span>Photo coming soon</span>')+'</div></section>'+
  '<h2 id="work" style="margin-top:50px">My Work</h2><p class="lead">A few of my best edits.</p><div class="slots">'+
  S.videos.map(v=>'<div class="slot tilt"><span class="tag">'+esc(v.l)+'</span>'+(safeUrl(v.u)?vid(v.u):'<div style="text-align:center">'+pl+'Coming soon</div>')+'</div>').join('')+'</div>'+
  '<section id="pricing"><h2>Pricing</h2><div class="bar"><p class="lead" style="margin:0">Final price depends on video type, motion and quality.</p><div class="tog" role="group" aria-label="Currency"><button id="inr" aria-pressed="'+(cur==='INR')+'">₹ INR</button><button id="usd" aria-pressed="'+(cur==='USD')+'">$ USD</button></div></div><div class="grid">'+
  S.cards.map(c=>{const a=c.a,b=c.b;const o=S.offer.on;return '<div class="card tilt">'+(o?'<span class="off">'+S.offer.pct+'% OFF</span>':'')+'<h3>'+esc(c.t)+'</h3><p class="len">'+esc(c.l)+'</p><div class="price">'+fmt(disc(a))+' – '+fmt(disc(b))+(o?'<span class="was">'+fmt(a)+' – '+fmt(b)+'</span>':'')+'</div></div>';}).join('')+
  '<div class="card big tilt"><div><h3>'+esc(tx.ctitle)+'</h3><p>'+esc(tx.ctext)+'</p></div><a class="btn" href="#contact">Book a live edit</a></div></div>'+
  '<p class="note">'+(cur==='USD'?'Dollar prices are approximate (1$ ≈ ₹'+S.rate+').':'')+(S.offer.on?' Discount is for new clients only.':'')+'</p></section>'+
  '<section class="contact" id="contact"><h2 style="margin-top:50px">Let’s work together</h2><p class="lead">Message me on Discord or Instagram.</p><div class="soc"><a href="'+esc(safeUrl(S.discord)||'#')+'" target="_blank" rel="noopener" aria-label="Discord">'+ICON_D+'</a><a href="'+esc(safeUrl(S.insta)||'#')+'" target="_blank" rel="noopener" aria-label="Instagram">'+ICON_I+'</a></div></section></main><footer>© Dhruv. Edits that hit different.</footer>';
  document.getElementById('inr').onclick=()=>{cur='INR';render();openAdmin()};
  document.getElementById('usd').onclick=()=>{cur='USD';render();openAdmin()};
}
document.addEventListener('pointermove',e=>{const t=e.target.closest&&e.target.closest('.tilt');if(!t||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const r=t.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;t.style.transform='rotateY('+x*9+'deg) rotateX('+(-y*9)+'deg) translateZ(6px)';});
document.addEventListener('pointerout',e=>{const t=e.target.closest&&e.target.closest('.tilt');if(t)t.style.transform='';});

// ---------- Admin (open with #admin at the end of the link) ----------
let draft=null;
const get=(o,p)=>p.split('.').reduce((a,k)=>a&&a[k],o);
function set(o,p,v){const ks=p.split('.');const l=ks.pop();ks.reduce((a,k)=>a[k],o)[l]=v;}
function closeAdmin(){const a=document.getElementById('adm');if(a)a.remove();if(location.hash==='#admin')history.replaceState(null,'',location.pathname+location.search);}
function openAdmin(){
  if(!(location.hash==='#admin'||/\/admin\/?$/.test(location.pathname))){return}
  let a=document.getElementById('adm');if(a)a.remove();
  a=document.createElement('div');a.id='adm';
  if(!isAdmin){a.innerHTML='<div class="panel"><h3>Admin</h3><p class="lead">Only the site owner can open this panel. Open this page while signed in to the owner’s Claude account.</p><button class="btn sm" id="ac">Close</button></div>';document.body.appendChild(a);document.getElementById('ac').onclick=closeAdmin;return;}
  if(!draft)draft=JSON.parse(JSON.stringify(S));
  const num=(p,l)=>'<div class="row"><label>'+l+'</label><input type="number" min="0" data-k="'+p+'" value="'+get(draft,p)+'"></div>';
  const txt=(p,l)=>'<div class="row"><label>'+l+'</label><input type="text" data-k="'+p+'" value="'+esc(get(draft,p))+'"></div>';
  const lk=(p,l,ph)=>'<div class="row"><label>'+l+'</label><input type="text" data-k="'+p+'" placeholder="'+ph+'" value="'+esc(String(get(draft,p)).startsWith('data:')?'':get(draft,p))+'"></div>';
  const up=(p,l,acc)=>'<div class="row"><label>'+l+'</label><input type="file" accept="'+acc+'" data-up="'+p+'"><span class="st" data-st="'+p+'">'+(get(draft,p)?'Added ✓':'')+'</span></div>';
  a.innerHTML='<div class="panel"><h3>Admin panel</h3><p class="lead">Change anything, then press Save. Everyone sees the update.</p>'+
  '<h4>New-client offer</h4><div class="row"><label>Offer on</label><input type="checkbox" id="oon" '+(draft.offer.on?'checked':'')+'></div>'+num('offer.pct','Discount %')+
  '<h4>Page text</h4>'+txt('tx.title','Main title')+txt('tx.sub','Intro text')+txt('tx.ctitle','Live edit title')+txt('tx.ctext','Live edit text')+'<h4>Pricing cards (₹, before discount)</h4>'+draft.cards.map((c,i)=>'<div class="blk">'+txt('cards.'+i+'.t','Name')+txt('cards.'+i+'.l','Details')+num('cards.'+i+'.a','Min price')+num('cards.'+i+'.b','Max price')+'<button class="btn ghost sm" data-del="cards.'+i+'">Remove</button></div>').join('')+'<button class="btn ghost sm" data-add="cards">+ Add pricing card</button>'+num('rate','₹ per $1')+
  '<h4>Photo and videos</h4>'+lk('photo','Photo link (optional)','https://...')+up('photo','Or upload photo (small)','image/*')+draft.videos.map((v,i)=>'<div class="blk">'+txt('videos.'+i+'.l','Video title')+lk('videos.'+i+'.u','Video link (no size limit)','YouTube, Google Drive, Vimeo or .mp4 link')+up('videos.'+i+'.u','Or upload file (max 8 MB)','video/*')+'<button class="btn ghost sm" data-del="videos.'+i+'">Remove</button></div>').join('')+'<button class="btn ghost sm" data-add="videos">+ Add video slot</button>'+
  '<h4>Social links</h4>'+txt('discord','Discord link')+txt('insta','Instagram link')+
  '<div class="row" style="margin-top:22px"><button class="btn" id="asv">Save and publish</button><button class="btn ghost" id="ac">Cancel</button><span class="st" id="ams"></span></div></div>';
  document.body.appendChild(a);
  a.oninput=e=>{const k=e.target.dataset.k;if(k)set(draft,k,e.target.type==='number'?+e.target.value:e.target.value);};
  document.getElementById('oon').onchange=e=>{draft.offer.on=e.target.checked};
  a.onclick=e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset.del,ad=b.dataset.add;if(!d&&!ad)return;
    if(ad==='cards')draft.cards.push({t:'New card',l:'Details',a:100,b:200});
    if(ad==='videos')draft.videos.push({l:'New video',u:''});
    if(d){const ks=d.split('.');draft[ks[0]].splice(+ks[1],1);}
    const sc=a.scrollTop;openAdmin();document.getElementById('adm').scrollTop=sc;};
  document.getElementById('ac').onclick=()=>{draft=null;closeAdmin()};
  a.onchange=async e=>{const p=e.target.dataset.up;if(!p||!e.target.files[0])return;const st=a.querySelector('[data-st="'+p+'"]');st.textContent='Uploading…';
    try{const as=await claude.use('assets');if(!as){st.textContent='Uploads not available';return}const r=await as.upload(e.target.files[0]);set(draft,p,r.url);st.textContent='Added ✓';}catch(x){st.textContent='Upload failed: '+(x.message||'try a smaller file (max 20 MB)');}};
  document.getElementById('asv').onclick=async()=>{const m=document.getElementById('ams');m.textContent='Publishing…';
    try{const ar=await claude.use('artifact');if(!ar){m.textContent='Cannot publish here';return}
      const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';const cv=c.querySelector('#bg');['width','height','style'].forEach(x=>cv.removeAttribute(x));
      c.querySelector('#data').textContent=JSON.stringify(draft).replace(/</g,'\\u003c');
      await ar.publish('<!DOCTYPE html>\n'+c.outerHTML);}catch(x){m.textContent='Could not publish: '+(x.message||x)}};
}
render();
(async()=>{try{claudeUser=await claude.use('user');isAdmin=!!(claudeUser&&claudeUser.canEdit());}catch(e){}openAdmin();})();
addEventListener('hashchange',()=>{if((location.hash==='#admin'||/\/admin\/?$/.test(location.pathname)))openAdmin();else{const a=document.getElementById('adm');if(a)a.remove()}});

// ---------- 3D background ----------
(function(){
  if(typeof THREE==='undefined')return;
  const rd=new THREE.WebGLRenderer({canvas:document.getElementById('bg'),alpha:true,antialias:true});
  rd.setPixelRatio(Math.min(devicePixelRatio,2));
  const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(55,1,.1,100);cam.position.z=12;
  const mat=col=>new THREE.MeshBasicMaterial({color:col,wireframe:true,transparent:true,opacity:.5});
  const objs=[];
  function add(g,col,x,y,z,s){const m=new THREE.Mesh(g,mat(col));m.position.set(x,y,z);m.scale.setScalar(s);m.userData={r:Math.random()*.01+.003,f:Math.random()*6};sc.add(m);objs.push(m);}
  add(new THREE.TorusKnotGeometry(1.2,.35,100,14),0xff4d8d,6,2.5,-2,1.5);
  add(new THREE.IcosahedronGeometry(1.5,1),0x3de0ff,-6.5,-1,-3,1.3);
  add(new THREE.TorusGeometry(1.4,.12,12,48),0xff4d8d,-5,4.5,-4,1);
  add(new THREE.TorusGeometry(1.1,.1,12,48),0x3de0ff,7,-4,-3,1.2);
  add(new THREE.OctahedronGeometry(.9),0xffffff,0,-6,-5,1);
  add(new THREE.BoxGeometry(1,1,1),0x3de0ff,-2,6.5,-6,1);
  add(new THREE.ConeGeometry(.8,1.6,5),0xff4d8d,3,-8,-6,1);
  add(new THREE.DodecahedronGeometry(1),0x3de0ff,-8,-7,-5,1);
  let mx=0,my=0,sy=0;
  addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;});
  addEventListener('scroll',()=>{sy=scrollY;},{passive:true});
  function size(){rd.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}
  addEventListener('resize',size);size();
  const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;let t=0;
  function loop(){t+=.01;
    objs.forEach(o=>{o.rotation.x+=o.userData.r;o.rotation.y+=o.userData.r*1.4;o.position.y+=Math.sin(t+o.userData.f)*.004;});
    cam.position.x+=((mx*3)-cam.position.x)*.04;cam.position.y+=((-my*2-sy*.004)-cam.position.y)*.04;cam.lookAt(0,-sy*.002,0);
    rd.render(sc,cam);requestAnimationFrame(loop);}
  calm?rd.render(sc,cam):loop();
})();
</script>
